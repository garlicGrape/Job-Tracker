<!DOCTYPE html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <title>Job Tracker</title>
    <style>
      :root {
        --indigo: #4f46e5;
        --indigo-dark: #4338ca;
        --slate-50: #f8fafc;
        --slate-200: #e2e8f0;
        --slate-500: #64748b;
        --slate-700: #334155;
        --slate-900: #0f172a;
        --emerald: #059669;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--slate-50);
        color: var(--slate-900);
      }
      .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
      header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
      .logo {
        width: 40px; height: 40px; border-radius: 12px; background: var(--indigo);
        display: flex; align-items: center; justify-content: center; color: #fff;
      }
      h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
      .subtitle { margin: 2px 0 0; font-size: 13px; color: var(--slate-500); }
      .card {
        background: #fff; border: 1px solid var(--slate-200); border-radius: 14px;
        padding: 18px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .field { display: flex; flex-direction: column; }
      .field.full { grid-column: 1 / -1; }
      label { font-size: 13px; font-weight: 600; color: var(--slate-700); margin-bottom: 6px; }
      input[type="text"], input[type="date"] {
        border: 1px solid var(--slate-200); border-radius: 9px; padding: 9px 11px;
        font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s;
      }
      input[type="text"]:focus, input[type="date"]:focus {
        border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }
      .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 26px; }
      .actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 12px; align-items: center; }
      button.primary {
        background: var(--indigo); color: #fff; border: none; border-radius: 9px;
        padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
        transition: background .15s;
      }
      button.primary:hover { background: var(--indigo-dark); }
      button.primary:disabled { opacity: .6; cursor: default; }
      .msg { font-size: 13px; }
      .msg.error { color: #e11d48; }
      .msg.success { color: var(--emerald); }
      h2 { font-size: 15px; margin: 28px 0 12px; color: var(--slate-700); }
      table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid var(--slate-200); }
      th, td { text-align: left; padding: 11px 14px; font-size: 14px; border-bottom: 1px solid var(--slate-200); }
      th { background: var(--slate-50); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--slate-500); }
      tr:last-child td { border-bottom: none; }
      .empty { text-align: center; color: var(--slate-500); padding: 28px; }
      .offer-yes { color: var(--emerald); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="7" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
        </div>
        <div>
          <h1>Job Tracker</h1>
          <p class="subtitle">Log every application to your Google Sheet.</p>
        </div>
      </header>

      <div class="card">
        <form id="app-form">
          <div class="field">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" placeholder="Acme Corp" required />
          </div>
          <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Senior Engineer" required />
          </div>
          <div class="field">
            <label for="dateApplied">Date Applied</label>
            <input type="date" id="dateApplied" name="dateApplied" required />
          </div>
          <div class="field">
            <div class="checkbox-row">
              <input type="checkbox" id="receivedOffer" name="receivedOffer" />
              <label for="receivedOffer" style="margin: 0;">Received offer</label>
            </div>
          </div>
          <div class="actions">
            <span id="form-msg" class="msg"></span>
            <button type="submit" class="primary" id="submit-btn">Add application</button>
          </div>
        </form>
      </div>

      <h2>Your applications</h2>
      <div id="table-container">
        <div class="empty">Loading…</div>
      </div>
    </div>

    <script>
      // ---- Rendering ---------------------------------------------------------
      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function render(applications) {
        var container = document.getElementById('table-container');
        if (!applications || applications.length === 0) {
          container.innerHTML = '<div class="card empty">No applications yet. Add your first one above.</div>';
          return;
        }
        var rows = applications
          .map(function (a) {
            var checked = a.receivedOffer ? 'checked' : '';
            return (
              '<tr>' +
              '<td>' + escapeHtml(a.company) + '</td>' +
              '<td>' + escapeHtml(a.title) + '</td>' +
              '<td>' + escapeHtml(a.dateApplied) + '</td>' +
              '<td><input type="checkbox" ' + checked +
              ' onchange="onToggleOffer(' + a.rowNumber + ', this.checked, this)" /></td>' +
              '</tr>'
            );
          })
          .join('');
        container.innerHTML =
          '<table><thead><tr>' +
          '<th>Company</th><th>Title</th><th>Date Applied</th><th>Offer</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table>';
      }

      function setMessage(text, kind) {
        var el = document.getElementById('form-msg');
        el.textContent = text || '';
        el.className = 'msg' + (kind ? ' ' + kind : '');
      }

      // ---- Server calls ------------------------------------------------------
      function loadApplications() {
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(function (err) {
            document.getElementById('table-container').innerHTML =
              '<div class="card empty">Could not load applications: ' + escapeHtml(err.message) + '</div>';
          })
          .getApplications();
      }

      function onSubmit(event) {
        event.preventDefault();
        var btn = document.getElementById('submit-btn');
        var payload = {
          company: document.getElementById('company').value,
          title: document.getElementById('title').value,
          dateApplied: document.getElementById('dateApplied').value,
          receivedOffer: document.getElementById('receivedOffer').checked
        };
        btn.disabled = true;
        setMessage('Saving…', '');
        google.script.run
          .withSuccessHandler(function (applications) {
            render(applications);
            document.getElementById('app-form').reset();
            btn.disabled = false;
            setMessage('Saved.', 'success');
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            setMessage(err.message, 'error');
          })
          .addApplication(payload);
      }

      function onToggleOffer(rowNumber, checked, el) {
        el.disabled = true;
        google.script.run
          .withSuccessHandler(function (applications) {
            render(applications);
          })
          .withFailureHandler(function (err) {
            el.disabled = false;
            el.checked = !checked;
            setMessage(err.message, 'error');
          })
          .setOffer(rowNumber, checked);
      }

      document.getElementById('app-form').addEventListener('submit', onSubmit);
      loadApplications();
    </script>
  </body>
</html>
