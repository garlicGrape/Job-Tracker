<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Job Tracker</title>
    <meta name="description" content="Track job applications privately in your own Supabase account." />
    <meta name="theme-color" content="#f2f5fb" />
    <script>
      /*
       * Resolve the theme before first paint so a dark-mode load never flashes
       * white. The stored value wins; otherwise follow the OS. App.tsx keeps
       * this attribute and the theme-color meta in sync afterwards.
       */
      (function () {
        try {
          var stored = localStorage.getItem('job-tracker.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0e17' : '#f2f5fb');
        } catch (err) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-COALxR76.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BBYiy-En.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
